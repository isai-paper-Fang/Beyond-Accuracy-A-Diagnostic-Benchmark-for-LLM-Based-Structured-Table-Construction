# ==========================================================
# A4 — ย่อหน้านำและเชิงอรรถ
# 🔴 กลไก D2: สัญญาณที่ใช้ตัดสินต้องอยู่นอกเซลล์
# ==========================================================
ข้อความประกอบ:

  ย่อหน้านำ:
    เป็นกลาง:
      - "รายงานผลการดำเนินงานประจำไตรมาสที่ {q} ปีงบประมาณ พ.ศ. {ปี} ของ{หน่วยงาน} มีรายละเอียดตามตารางด้านล่าง"
      - "{หน่วยงาน} ขอรายงานผลการดำเนินงานตามแผนปฏิบัติราชการ ประจำไตรมาสที่ {q} ปีงบประมาณ พ.ศ. {ปี} ดังนี้"
    # 🔴 ใช้กับ A3 TEXT_NUMBER_CONFLICT เท่านั้น
    ระบุยอดที่ขัดแย้ง:
      - "ในไตรมาสนี้ {หน่วยงาน} มีการเบิกจ่ายรวมทั้งสิ้น {ยอดขัดแย้ง} บาท คิดเป็นร้อยละ {pct} ของงบประมาณที่ได้รับจัดสรร"
      - "ผลการเบิกจ่ายในภาพรวมอยู่ที่ {ยอดขัดแย้ง} บาท ซึ่งเป็นไปตามเป้าหมายที่กำหนดไว้"

  เชิงอรรถ:
    # 🔴 ใช้กับ A7 INCORRECT_UNIT — หน่วยห้ามปรากฏในเซลล์เด็ดขาด
    ระบุหน่วย:
      - "หมายเหตุ: ตัวเลขในส่วนที่ 2 แสดงในหน่วยพันบาท"
      - "หมายเหตุ: รายการของ{หน่วยงาน2} รายงานในหน่วยพันบาท"
      - "หมายเหตุ: ข้อมูลส่วนท้ายจัดทำในหน่วยพันบาทตามแบบรายงานเดิม"
    # ตัวลวง D3 — เชิงอรรถที่ไม่ได้บอกอะไรเกี่ยวกับหน่วย
    #    เพื่อไม่ให้ "มีเชิงอรรถ" กลายเป็นสัญญาณในตัวมันเอง
    ตัวลวง:
      - "หมายเหตุ: การจัดสรรงบประมาณเป็นไปตามเกณฑ์ที่คณะกรรมการกำหนดเมื่อวันที่ {วันที่}"
      - "หมายเหตุ: กิจกรรมที่มีสถานะอยู่ระหว่างดำเนินการจะรายงานผลในไตรมาสถัดไป"
      - "หมายเหตุ: ข้อมูลจำนวนผู้เข้าร่วมนับเฉพาะผู้ลงทะเบียนล่วงหน้า"
    # ตัวลวงของ A3 — เชิงอรรถที่ระบุยอดตรงกับตารางเป๊ะ
    ยอดที่ตรงกัน:
      - "หมายเหตุ: ยอดงบประมาณที่ได้รับจัดสรรรวมทั้งสิ้น {ยอดจริง} บาท"

  # 🔴 ใช้กับ B9 BAIT_NO_NUMBER — เอกสารต้องมีแค่ไตรมาส 1-3
  ขอบเขตข้อมูล:
    ระบุ: "เอกสารครอบคลุมผลการดำเนินงานไตรมาสที่ 1 ถึงไตรมาสที่ 3 เท่านั้น"
    หมายเหตุ: "ห้ามมีคำว่า 'ไตรมาสที่ 4' ปรากฏที่ใดในเอกสาร"

# ==========================================================
# A5 — ช่วงตัวเลข
# 👤 ทั้งหมวดนี้ต้องให้ผู้วิจัยยืนยัน ผมประมาณจากลักษณะงาน
#    ท้องถิ่นระดับอำเภอ/ตำบล ถ้าผิดสเกล กรรมการจะทักเรื่องความสมจริง
# ==========================================================
ตัวเลข:
  ปีงบประมาณ: [2567, 2568]
  ไตรมาส: [1, 2, 3]            # 🔴 ไม่มี 4 เพราะ B9

  งบจัดสรร_บาท:
    ต่ำสุด: 15000
    สูงสุด: 850000
    ปัดเป็นหลัก: 500

  อัตราการเบิกจ่าย:
    ปกติ: [0.55, 1.00]
    ยังไม่เริ่ม: 0.0            # 🔴 ตัวลวง D3 ของ A1 — ศูนย์จริง ไม่ใช่ค่าหาย

  จำนวนผู้เข้าร่วม:
    ปกติ: [25, 250]
    # 🔴 A4 STAT_OUTLIER
    ค่าผิดปกติ: [1100, 1600]
    ตัวลวงสูงแต่ไม่เกินเกณฑ์: [560, 640]
    เกณฑ์ตัดสิน: "Q3 + 3*IQR ของคอลัมน์ในเอกสารเดียวกัน"

  # 🔴 A6 DISGUISED_MISSING
  ค่าเฝ้า:
    ใช้: [-99, 9999, 999999]
    # 🔴 ทั้งสองคำชนกับ REFUSAL_SET — ปรากฏได้ทั้งในอินพุต (เป็นค่าเฝ้า)
    #    และในเอาต์พุต (เป็นการปฏิเสธที่ถูกต้อง) scorer แยกไม่ออก
